<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMORI</title>
    <style>
        body {
            background-color: white;
            margin: 0;
            position: fixed;
        }
        #title {
            display: grid;
            /* image-rendering: pixelated; */
            width: 100vw;
            height: 100vh;
            align-items: center;
            justify-content: center;
            /* flex-direction: column; */
            justify-self: center;
            align-self: center;
        }
        #omori {
            align-self: flex-end;
            object-fit: contain;
            width: 425px;
        }
        #logo {
            object-fit: contain;
            width: 400px;
            justify-self: center;
            align-self: flex-start;
        }

        @media (max-width: 500px) {
            #logo {
                width: 300px;
            }
            #omori {
                width: 325px;
            }
        }
    </style>
</head>
<body>
    <audio src="title.m4a" autoplay loop></audio>
    <div id="title">
        <img id="logo" src="logo.gif">
        <img id="omori" src="omori.gif">
    </div>
</body>
</html>
