<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Space.</title>
    <link rel="icon" href="../icons/whitespace.png">
    <style>
        @font-face {
            font-family: 'omori';
            src: url('../OMORI_GAME2.ttf');
            font-style: normal;
            font-weight: normal;
        }
        body{
            font-family: omori;
            text-align: center;
            margin: 0;
            /* margin-top: 2%; */
            background-color: white;
            display: flex;
            /* height: 90vh; */
            transition: background-color 2s ease;
        }
        #vid{
            width: 80%;
            height: 80%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            image-rendering: pixelated;
            transition: 
            opacity 16s ease-in-out,
            top 16s linear;
            position: relative;
            top: 700px;
        }
        #space h1 {
            /* font-size: ; */
            /* min-height: 100px; */
            min-width: 30%;
            min-height: min-content;
        }
        #space{
            position: fixed;
            opacity: 0;
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            /* max-width: 900px; */
            max-height: 100vh;
            text-align: center;
            align-items: center;
            justify-content: center;
            transition: 
            opacity 16s ease-in-out,
            top 16s linear;
        }
        #redhand {
            width: 30px;
            height: 30px;
            object-fit: contain;
            image-rendering: pixelated;
            align-self: flex-start;
            margin-left: 20px;
            user-select: none;
            /* pointer-events: none; */
        }
        #redhand:hover {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <audio src="whitespace.m4a" loop id="aud">
    </audio>
    <div id="space">
        <h1>A place to survive, but not to live.</h1>
        <video muted autoplay loop id="vid">
            <source src="../vid/whitespace.mp4" type="video/mp4">
        </video>
        <img id="redhand" src="redhand.gif" alt="">
    </div>
    <script>
        const audio = document.getElementById("aud");
        let vid = document.getElementById("vid");
        let redhand = document.getElementById("redhand");
        let body = document.querySelector("body");
        let space = document.getElementById("space");
        let started = false;
        audio.play();
        audio.play().then(() => {
            fadeIn(audio, 1, 8000);
            boom();
            // document.removeEventListener("click", startAudio);
            // document.removeEventListener("keydown", startAudio);
            // document.removeEventListener("scroll", startAudio);
        });

        redhand.addEventListener("click", () => {
            back();
        });
        
        function back() {
            space.style.transition = "opacity 3s ease";
            space.style.opacity = 0;
            fadeIn(audio, 0, 5)
            setTimeout(() => {
                body.style.backgroundColor = "#000000";
                setTimeout(() => {
                    window.location.href = "https://gigachannel2.github.io/Super-Secret-Website-That-You-Do-Not-Want-To-Enter/";
                }, 2000);
            }, 3000);
        }

        
        // document.addEventListener("click", startAudio);
        // document.addEventListener("keydown", startAudio);
        // document.addEventListener("scroll", startAudio);
    
        // function startAudio() {
        //     audio.muted = false;
        //     audio.volume = 0;
        //     started = true;

        //     audio.play().then(() => {
        //         fadeIn(audio, 1, 8000);
        //         boom();
        //         // document.removeEventListener("click", startAudio);
        //         // document.removeEventListener("keydown", startAudio);
        //         // document.removeEventListener("scroll", startAudio);
        //     }).catch(() => {
        //         started = false;
        //         // kalau gagal, tunggu interaction berikutnya
        //     });
        // }

        function boom() {
            space.style.opacity = 1;
            vid.style.top = 0;
            fadeIn(audio, 1, 8000);
        }

        function fadeIn(audio, targetVolume, duration) {
            let step = targetVolume / (duration / 50);
            let interval = setInterval(() => {
                if (audio.volume < targetVolume) {
                    audio.volume = Math.min(audio.volume + step, targetVolume);
                } else {
                    clearInterval(interval);
                }
            }, 50);
        }
    </script>
</body>
</html>
